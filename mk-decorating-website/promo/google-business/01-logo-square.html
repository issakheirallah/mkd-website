<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .card { background: var(--white); display: flex; align-items: center; justify-content: center; }
    .stack { display: flex; flex-direction: column; align-items: center; gap: 36px; }
    .name { font-family: var(--font-display); font-weight: 800; font-size: 78px; color: var(--navy); letter-spacing: -0.025em; line-height: 1; }
    .tag  { font-family: var(--font-body); font-weight: 600; font-size: 22px; color: var(--teal); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="stack">
      <svg width="280" height="160" viewBox="0 0 144 82" aria-hidden="true">
        <polygon points="0.816 80.973 72 80.973 36.406 18.688" fill="#00aeae" />
        <polygon points="72 80.973 143.184 80.973 107.594 18.688" fill="#00aeae" />
        <polygon points="36.305 1.027 107.59 1.027 72 63.313" fill="#1d3557" />
      </svg>
      <div style="text-align:center;">
        <div class="name">MK Decorating</div>
        <div class="tag">Renovation · Refurbishment</div>
      </div>
    </div>
  </div>
</body>
</html>
