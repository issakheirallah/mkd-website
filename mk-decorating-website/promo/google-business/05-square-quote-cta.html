<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .card { background: var(--teal); color: var(--white); padding: 88px 80px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 2; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .name { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--white); letter-spacing: -0.02em; }
    .eyebrow { font-size: 14px; color: rgba(255,255,255,0.78); }
    .middle { position: relative; z-index: 2; }
    .lead { font-family: var(--font-body); font-weight: 600; font-size: 18px; color: rgba(255,255,255,0.82); margin-bottom: 16px; letter-spacing: 0.04em; text-transform: uppercase; }
    .headline { font-family: var(--font-display); font-weight: 800; font-size: 96px; color: var(--white); letter-spacing: -0.03em; line-height: 0.98; max-width: 11ch; }
    .actions { display: flex; flex-direction: column; gap: 18px; margin-top: 56px; position: relative; z-index: 2; }
    .row { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-weight: 700; font-size: 32px; color: var(--white); }
    .row svg { color: var(--white); }
    .row.smaller { font-size: 22px; font-weight: 600; }
    .accents { position: absolute; left: -120px; top: -120px; width: 720px; height: 720px; opacity: 0.12; pointer-events: none; }
    .tri { position: absolute; background: var(--navy); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 6px; }
    .tri-1 { left: 0; top: 0; width: 420px; height: 380px; }
    .tri-2 { left: 220px; top: 220px; width: 320px; height: 280px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="accents">
      <div class="tri tri-1"></div>
      <div class="tri tri-2"></div>
    </div>
    <div class="top">
      <div class="brand">
        <svg width="42" height="24" viewBox="0 0 144 82" aria-hidden="true">
          <polygon points="0.816 80.973 72 80.973 36.406 18.688" fill="#ffffff" />
          <polygon points="72 80.973 143.184 80.973 107.594 18.688" fill="#ffffff" />
          <polygon points="36.305 1.027 107.59 1.027 72 63.313" fill="#1d3557" />
        </svg>
        <span class="name">MK Decorating</span>
      </div>
      <div class="eyebrow">GET IN TOUCH</div>
    </div>
    <div class="middle">
      <div class="lead">Free, no-obligation</div>
      <div class="headline">Request a quote.</div>
    </div>
    <div class="actions">
      <div class="row">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.1 1.18 2 2 0 012.1 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        077 8891 4110
      </div>
      <div class="row smaller">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        info@mkdecorating.net
      </div>
      <div class="row smaller">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
        mkdecorating.net
      </div>
    </div>
  </div>
</body>
</html>
