<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .card { background: var(--navy); padding: 88px 80px; display: flex; flex-direction: column; color: var(--white); position: relative; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 56px; position: relative; z-index: 2; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .name { font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--white); letter-spacing: -0.02em; }
    .eyebrow { font-size: 14px; color: var(--teal); }
    .headline { font-family: var(--font-display); font-weight: 800; font-size: 76px; color: var(--white); letter-spacing: -0.025em; line-height: 1.05; margin: 16px 0 44px; max-width: 14ch; position: relative; z-index: 2; }
    .accent { color: var(--teal); }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; position: relative; z-index: 2; }
    .chip { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 22px 24px; display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-weight: 600; font-size: 18px; color: var(--white); }
    .pin { color: var(--teal); flex-shrink: 0; }
    .accents { position: absolute; right: -120px; bottom: -120px; width: 720px; height: 720px; opacity: 0.07; pointer-events: none; }
    .tri { position: absolute; background: var(--teal); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border-radius: 6px; }
    .tri-1 { right: 0; top: 0; width: 480px; height: 440px; }
    .tri-2 { right: 200px; bottom: 0; width: 320px; height: 280px; }
    .footer { margin-top: auto; padding-top: 40px; font-family: var(--font-body); font-weight: 600; font-size: 16px; color: rgba(255,255,255,0.5); position: relative; z-index: 2; display: flex; justify-content: space-between; }
    .footer .url { color: var(--teal); }
  </style>
</head>
<body>
  <div class="card">
    <div class="accents">
      <div class="tri tri-1"></div>
      <div class="tri tri-2"></div>
    </div>
    <div class="top">
      <div class="brand">
        <svg width="42" height="24" viewBox="0 0 144 82" aria-hidden="true">
          <polygon points="0.816 80.973 72 80.973 36.406 18.688" fill="#00aeae" />
          <polygon points="72 80.973 143.184 80.973 107.594 18.688" fill="#00aeae" />
          <polygon points="36.305 1.027 107.59 1.027 72 63.313" fill="#ffffff" />
        </svg>
        <span class="name">MK Decorating</span>
      </div>
      <div class="eyebrow">AREAS COVERED</div>
    </div>
    <div class="headline">Working across <span class="accent">London.</span></div>
    <div class="grid">
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Central</div>
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>North</div>
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>East</div>
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>West</div>
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>South</div>
      <div class="chip"><svg class="pin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Greater</div>
    </div>
    <div class="footer">
      <span class="url">mkdecorating.net</span>
      <span>info@mkdecorating.net</span>
    </div>
  </div>
</body>
</html>
